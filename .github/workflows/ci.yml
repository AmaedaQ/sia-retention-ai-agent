name: CI

# Three independent gates, each one honest about what it checks and nothing
# more: lint catches real bugs (not style nitpicks -- see pyproject.toml),
# security scans the code and dependencies actually shipped, and tests run
# the real suite. None of them need network or paid services, so every PR
# gets the same signal a free-tier contributor gets locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit pip-audit
      # Static analysis of our own code for common issues (hardcoded
      # secrets, shell injection, unsafe deserialization, etc).
      - run: bandit -c pyproject.toml -r backend config scripts notebooks
      # Known-vulnerability scan of the exact pinned dependency versions in
      # requirements.txt -- continue-on-error because a new CVE in a
      # transitive dependency shouldn't silently block every PR; it's
      # reported so a human decides, not so CI decides for them.
      - run: pip-audit -r requirements.txt
        continue-on-error: true

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      # Heavy ML deps (xgboost, shap) are in requirements.txt already, so
      # the model-integration tests run for real here, not skipped -- only
      # the Colab-only training/publish scripts are out of scope for CI
      # (they need a real GPU-optional but network-heavy HF push).
      - run: pytest tests/ -v
